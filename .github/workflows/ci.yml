name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake git gperf pkg-config libclang-dev \
            libssl-dev zlib1g-dev libasound2-dev libdbus-1-dev \
            libwayland-dev libxkbcommon-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache pinned TDLib
        uses: actions/cache@v4
        id: tdlib
        with:
          path: third_party/tdlib
          key: tdlib-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-tdlib.sh', 'scripts/security/tdlib-*.patch') }}
      - name: Build pinned TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        env:
          JOBS: "2"
        run: scripts/build-tdlib.sh
      - name: Test
        run: |
          log="$RUNNER_TEMP/telega-test.log"
          if cargo test --locked --all-targets >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            report="$(tail -c 3500 "$log")"
            report="${report//'%'/'%25'}"
            report="${report//$'\r'/'%0D'}"
            report="${report//$'\n'/'%0A'}"
            printf '::error title=Cargo test failure::%s\n' "$report"
            exit "$status"
          fi
      - name: Native boundary regressions
        run: bash scripts/security-observer-probe.sh
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Telega $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
